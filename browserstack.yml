userName: ${BROWSERSTACK_USERNAME}
accessKey: ${BROWSERSTACK_ACCESS_KEY}
framework: playwright
platforms:
  - os: OS X
    osVersion: Sonoma
    browserName: chrome
    browserVersion: latest
  - os: Windows
    osVersion: 11
    browserName: playwright-firefox
    browserVersion: latest
  - os: OS X
    osVersion: Sonoma
    browserName: playwright-webkit
    browserVersion: latest
  - os: Windows
    osVersion: 11
    browserName: edge
    browserVersion: latest
browserstackLocal: false
buildName: playwright-bdd-framework
projectName: Playwright BDD Cucumber
resolution: 1280x720
networkLogs: true
consoleLogs: info
debug: true
